# Recut desktop builds (V3, Pressing Crew). Untested on real runners when written: see docs/BUILD.md.
#
# Triggers: a manual run (workflow_dispatch) and a pushed tag that starts with "v" (for example v0.2.0).
# What it does on macOS, Windows and Linux runners: npm ci in app/, the Node checks that need no browser, the installer
# build, and the installers uploaded as a workflow artifact. On a tag it also attaches them to a DRAFT release, which
# nothing shows to the public until the owner presses Publish.
#
# Signing: unsigned unless these repository secrets exist (none is required, none is ever printed):
#   macOS    CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows  WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD
# An unset secret arrives as an empty string; the build step unsets empty variables so electron-builder sees them as absent.
name: build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./app/package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match app/package.json version $version" >&2
            exit 1
          fi

      - name: Install
        working-directory: app
        run: npm ci

      - name: Node checks (no browser)
        # selfcheck.js and every tools/*-check.js except the three that start headless Chromium
        # (browser-check, export-check, importer-check: run those locally). All run even if one fails.
        run: |
          failed=0
          for f in app/engine/selfcheck.js tools/*-check.js; do
            case "$f" in
              tools/browser-check.js|tools/export-check.js|tools/importer-check.js) continue ;;
            esac
            echo "::group::$f"
            if node "$f"; then echo "ok $f"; else echo "FAILED $f" >&2; failed=1; fi
            echo "::endgroup::"
          done
          exit $failed

      - name: Build installers
        working-directory: app
        env:
          SCRIPT: ${{ matrix.script }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          if [ -z "${CSC_LINK:-}${WIN_CSC_LINK:-}" ]; then echo "No signing certificate: building unsigned."; fi
          npm run "$SCRIPT"

      - name: List installers
        run: ls -l app/dist

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.os }}
          path: |
            app/dist/*.dmg
            app/dist/*.zip
            app/dist/*.exe
            app/dist/*.AppImage
            app/dist/*.deb
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          ls -l
          sha256sum * > SHA256SUMS.txt
          notes="Unsigned builds. Install steps for macOS, Windows and Linux: docs/BUILD.md. Checksums: SHA256SUMS.txt."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber ./*
          else
            gh release create "$TAG" --draft --verify-tag --title "Recut ${TAG#v}" --notes "$notes" ./*
          fi
