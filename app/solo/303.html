<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111114">
<title>HVT-303</title>
<link rel="stylesheet" href="../ui/panels.css">
<link rel="stylesheet" href="solo.css">
</head>
<body>
<header class="so-head">
  <span class="so-mark">HAVANTECHNO</span>
  <span class="so-model">HVT-303</span>
  <span class="so-status" id="so-status" role="status" aria-live="polite">not started</span>
</header>
<nav class="so-bar" aria-label="Playback">
  <button type="button" id="so-play" class="so-btn so-play" aria-pressed="false" disabled>Play</button>
  <div class="so-group" role="radiogroup" aria-label="Pattern" id="so-patterns"></div>
  <div class="so-group so-tempo" aria-label="Tempo">
    <button type="button" class="so-btn so-small" id="so-slower" aria-label="Slower">−</button>
    <label class="so-field"><span>BPM</span><input id="so-bpm" type="number" inputmode="decimal" min="40" max="300" step="1" value="126"></label>
    <button type="button" class="so-btn so-small" id="so-faster" aria-label="Faster">+</button>
  </div>
  <button type="button" id="so-drum" class="so-btn" aria-pressed="false">Kick off</button>
  <label class="so-field so-drive"><span>Drive</span><input id="so-drive" type="range" min="0" max="1" step="0.01" value="0" aria-label="Drive"></label>
</nav>
<main id="so-panel" class="so-panel" aria-label="HVT-303 panel"></main>
<p class="so-help">Tap a step, then a note key. ACCENT, SLIDE, REST, DOWN and UP act on the selected step. Drag a knob up or down; double-tap returns it to the pattern's value.</p>
<div id="so-gate" class="so-gate" role="dialog" aria-modal="true" aria-label="Start audio">
  <button type="button" id="so-start" class="so-start">
    <span class="so-start-mark">HAVANTECHNO</span>
    <span class="so-start-model">HVT-303</span>
    <span class="so-start-tap">Tap to start</span>
  </button>
  <p class="so-gate-note" id="so-gate-note">Browsers start audio only after a tap.</p>
</div>
<noscript>The HVT-303 needs JavaScript.</noscript>
<!-- the real engine and the real panel, by relative path (nothing copied) -->
<script src="../engine/core.js"></script>
<script src="../engine/programs.js"></script>
<script src="../engine/synths.js"></script>
<script src="../engine/drums.js"></script>
<script src="../engine/worklets.js"></script>
<script src="../engine/classics.js"></script>
<script src="../engine/processors.js"></script>
<script src="../engine/songdoc.js"></script>
<script src="../engine/sequencer.js"></script>
<script src="../engine/song.js"></script>
<script src="../engine/host.js"></script>
<script src="../ui/panels.js"></script>
<script src="solo.js"></script>
</body>
</html>
